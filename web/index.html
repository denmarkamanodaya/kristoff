<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristoff</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth gate: nothing else renders or loads until a TOTP code is verified -->
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form id="gateForm" class="gate-card" novalidate>
    <div class="brand"><div class="mark">K</div><span id="gateTitle">Kristoff</span></div>
    <label for="otp" class="gate-label">Enter the 6-digit code from your authenticator app</label>
    <input id="otp" name="otp" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
      pattern="[0-9]*" spellcheck="false" aria-describedby="gateMsg" autofocus>
    <p id="gateMsg" class="gate-msg" role="alert" aria-live="assertive"></p>
    <button type="submit" class="btn gate-btn">Unlock</button>
  </form>
</div>

<!-- App -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><div class="mark">K</div><span>Kristoff</span></div>
    <button id="newThread" class="new-thread"><span>New Thread</span><kbd>⌘K</kbd></button>
    <nav>
      <a data-view="home" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Home</a>
      <a data-view="library" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4 1-3 14-4-1z"/></svg>Library</a>
    </nav>
    <div class="recent-label">Recent</div>
    <ul id="threadList" class="thread-list"></ul>
    <button id="moreThreads" class="more" type="button" hidden>Load more</button>
    <div class="side-foot">
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="true">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
      <div id="usage" class="usage"></div>
    </div>
  </aside>

  <main class="main">
    <div id="notice" class="notice" role="alert" hidden><span></span><button type="button" title="Dismiss" aria-label="Dismiss">×</button></div>
    <!-- Home -->
    <section id="home" class="view home">
      <h1 class="home-title">What are we researching?</h1>
      <div id="homeSlot" class="composer-slot"></div>
      <div class="suggestions">
        <button data-q="Make a case digest: facts, issues, ruling, ratio decidendi and doctrines.">Case digest</button>
        <button data-q="Summarize the main argument of this paper and the key authorities it relies on.">Summarize a paper</button>
        <button data-q="Give me 3 bar-exam style questions from this material, with suggested answers.">Bar-style practice</button>
        <button data-q="Explain this ruling in plain language for a first-year law student.">Explain simply</button>
      </div>
    </section>

    <!-- Thread -->
    <section id="thread" class="view thread" hidden>
      <div class="thread-head">
        <div id="threadTitle" class="thread-title"></div>
        <div class="head-right">
          <div id="threadDocs" class="thread-docs"></div>
          <button type="button" id="deleteOpenThread" class="tool head-del" aria-label="Delete this thread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button>
        </div>
        <div id="headConfirm" class="head-confirm" hidden></div>
      </div>
      <div id="turns" class="turns"></div>
      <div class="follow-wrap"><div id="threadSlot" class="composer-slot"></div></div>
    </section>

    <!-- Library -->
    <section id="library" class="view library" hidden>
      <div class="lib-head">
        <h1>Library</h1>
        <label class="btn">Upload PDF<input class="fileInput" type="file" accept="application/pdf" multiple hidden></label>
      </div>
      <p class="muted">Your uploaded decisions, statutes and papers. Attach them to a thread from the composer.</p>
      <ul class="upload-list"></ul>
      <div id="libGrid" class="lib-grid"></div>
      <button id="moreDocs" class="more lib-more" type="button" hidden>Load more</button>
    </section>

    <div class="disclaimer">AI can be wrong. Verify citations against the SC E-Library, Lawphil or the Official Gazette.</div>
  </main>
</div>

<!-- Shared composer (moved between home and thread) -->
<template id="composerTpl">
  <form class="composer">
    <div class="chips"></div>
    <textarea rows="1" maxlength="8000" aria-label="Question" placeholder="Ask anything about your documents…"></textarea>
    <div class="toolbar">
      <div class="left">
        <button type="button" class="tool attach-btn" title="Attach documents"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L15 7.5"/></svg>Attach</button>
        <label class="model-pick" hidden><span class="sr-only">Model</span><select class="model-select"></select></label>
      </div>
      <button type="submit" class="send" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="attach-pop" hidden>
      <div class="pop-head"><span>Attach from library</span><label class="link">Upload PDF<input class="fileInput" type="file" accept="application/pdf" multiple hidden></label></div>
      <ul class="upload-list"></ul>
      <div class="pop-hint"></div>
      <ul class="pop-list"></ul>
    </div>
  </form>
</template>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
