# Pure crate: no clock, IO, processes, env or network (core/architecture-hexagonal.md).
too-many-lines-threshold = 40
too-many-arguments-threshold = 4
cognitive-complexity-threshold = 10
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
doc-valid-idents = ["SQLite", "TOTP", "ULID", "ULIDs", "IPC", "MiB", "TypeScript", "JavaScript", "WebView", "..."]
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "inject Clock" },
  { path = "std::time::Instant::now", reason = "inject Clock" },
  { path = "std::env::var", reason = "config comes from the composition root" },
  { path = "std::env::var_os", reason = "config comes from the composition root" },
  { path = "std::process::Command::new", reason = "processes live in adapters" },
  { path = "std::fs::read", reason = "IO lives in adapters" },
  { path = "std::fs::write", reason = "IO lives in adapters" },
  { path = "std::fs::rename", reason = "IO lives in adapters" },
  { path = "std::fs::remove_file", reason = "IO lives in adapters" },
  { path = "std::fs::remove_dir_all", reason = "IO lives in adapters" },
  { path = "std::fs::File::open", reason = "IO lives in adapters" },
  { path = "std::fs::File::create", reason = "IO lives in adapters" },
  { path = "std::fs::read_dir", reason = "IO lives in adapters" },
]
disallowed-types = [
  { path = "std::net::TcpStream", reason = "network lives in adapters" },
  { path = "std::net::TcpListener", reason = "network lives in adapters" },
  { path = "std::fs::OpenOptions", reason = "IO lives in adapters" },
]
