[workspace]
resolver = "3"
members = [
    "crates/kristoff-core",
    "crates/kristoff-contracts",
    "crates/kristoff-adapters",
    "crates/kristoff-testkit",
    "crates/kristoff-anthropic",
    "crates/kristoff-pdf",
    "crates/kristoff-embed",
    "crates/kristoff-law",
    "crates/kristoff-ingest",
    "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false
rust-version = "1.99"

# Exact versions (stack/supply-chain.md). Every external crate below is the version DexFS already
# approved and pinned; each was at least 7 days old when DexFS checked it on 2026-10-18 (tokio
# 2026-10-19). Re-checked for Kristoff on 2026-11-12: all are older than 7 days.
[workspace.dependencies]
kristoff-core = { path = "crates/kristoff-core" }
kristoff-contracts = { path = "crates/kristoff-contracts" }
kristoff-adapters = { path = "crates/kristoff-adapters" }
kristoff-testkit = { path = "crates/kristoff-testkit" }
kristoff-anthropic = { path = "crates/kristoff-anthropic" }
kristoff-pdf = { path = "crates/kristoff-pdf" }
kristoff-embed = { path = "crates/kristoff-embed" }
kristoff-law = { path = "crates/kristoff-law" }
tauri = { version = "=2.12.3", features = [] }
tauri-build = { version = "=2.7.2", features = [] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
ring = "=0.17.14"
tempfile = "=3.27.0"
proptest = "=1.12.0"
# Phase 2 (owner-approved 2026-11-12). reqwest and tokio are the DexFS pins (tokio 1.53.3 is from
# 2026-10-13). lopdf 0.47.0 was published 2026-11-04 (8 days old on 2026-11-12); default features
# off (no chrono, no rayon).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
lopdf = { version = "=0.47.0", default-features = false }
# Phase 3 (owner-approved 2026-11-12; checked on crates.io that day, all >= 7 days old):
# candle-* 0.11.1 (2026-10-31; metal for the Apple GPU), tokenizers 0.23.2 (2026-09-03; default
# features off, onig only), parquet 60.1.0 (2026-10-28; default features off, zstd only, used by
# the kristoff-ingest dev tool; `snap` added 2026-11-12 for the Snappy-compressed OmniCorpus
# parquet, pulling snap 1.1.2 of 2026-07-15, BSD-3-Clause, ingest only), anyhow 1.0.104 (2026-07-18; kristoff-ingest bin only).
candle-core = { version = "=0.11.1", features = ["metal"] }
candle-nn = { version = "=0.11.1", features = ["metal"] }
candle-transformers = { version = "=0.11.1", features = ["metal"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
parquet = { version = "=60.1.0", default-features = false, features = ["zstd", "snap"] }
anyhow = "=1.0.104"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
too_many_lines = "warn"
